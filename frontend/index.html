<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GermSDR WebSDR</title>
  </head>
  <body>
    <div id="app">
      <header class="topbar">
        <div class="brand">
          <span class="brand-mark"></span>
          <div>
            <strong>GermSDR</strong>
            <span id="sourceLabel">starting</span>
          </div>
        </div>
        <div class="readouts">
          <span id="freqReadout">100.800 MHz</span>
          <span id="modeReadout">WBFM</span>
          <span id="fftReadout">32768 FFT</span>
        </div>
      </header>

      <main class="workspace">
        <section class="viewport">
          <canvas id="waterfall" aria-label="Live SDR waterfall"></canvas>
          <div class="spectrum-line"></div>
          <div class="hud">
            <span id="frameReadout">0 fps</span>
            <span id="clientReadout">0 clients</span>
            <span id="dropReadout">0 drops</span>
          </div>
        </section>

        <aside class="controls" aria-label="SDR controls">
          <label class="field">
            <span>Frequency</span>
            <div class="frequency-row">
              <input id="frequencyInput" type="number" min="1" step="1000" value="100800000" />
              <button id="tuneButton" class="icon-button" title="Tune" aria-label="Tune" type="button" data-lucide="radio"></button>
            </div>
          </label>

          <div class="field">
            <span>Mode</span>
            <div class="segments" id="modeSegments">
              <button type="button" data-mode="wbfm" class="active">WBFM</button>
              <button type="button" data-mode="am">AM</button>
              <button type="button" data-mode="usb">USB</button>
              <button type="button" data-mode="lsb">LSB</button>
              <button type="button" data-mode="cw">CW</button>
            </div>
          </div>

          <label class="field">
            <span>Gain</span>
            <div class="slider-row">
              <input id="gainSlider" type="range" min="-1" max="49" step="1" value="-1" />
              <output id="gainOutput">auto</output>
            </div>
          </label>

          <label class="field">
            <span>FFT Size</span>
            <select id="fftSelect">
              <option value="2048">2048</option>
              <option value="4096">4096</option>
              <option value="8192">8192</option>
              <option value="16384">16384</option>
              <option value="32768" selected>32768</option>
            </select>
          </label>

          <label class="field">
            <span>Palette</span>
            <select id="paletteSelect">
              <option value="spectrum">Spectrum</option>
              <option value="inferno">Inferno</option>
              <option value="viridis">Viridis</option>
              <option value="mono">Mono</option>
            </select>
          </label>

          <label class="field">
            <span>dB Floor</span>
            <div class="slider-row">
              <input id="floorSlider" type="range" min="-140" max="-20" value="-110" />
              <output id="floorOutput">-110</output>
            </div>
          </label>

          <label class="field">
            <span>dB Ceiling</span>
            <div class="slider-row">
              <input id="ceilingSlider" type="range" min="-120" max="0" value="-25" />
              <output id="ceilingOutput">-25</output>
            </div>
          </label>

          <button id="audioButton" class="primary" type="button">
            <span data-lucide="volume-2"></span>
            Start Audio
          </button>
        </aside>
      </main>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
